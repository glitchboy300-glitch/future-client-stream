[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  command = "npm run build"
  publish = "dist"

# SPA catch-all removed 2026-07-31: routes are prerendered to real files at
# build time (scripts/prerender.mjs), so unknown paths now 404 properly via
# public/_redirects. Do NOT re-add "/* /index.html 200" - it caused sitewide
# soft-404s.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Daily cal-webhook self-test cron removed 2026-07-23.
# It sent a test email through Resend every day at 04:00 UTC and was
# hurting deliverability. To re-enable:
# [functions."cal-webhook-selftest"]
#   schedule = "0 4 * * *"
